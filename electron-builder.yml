appId: com.schoolees.ai-usage
productName: AI Usage
directories:
  buildResources: build
  output: dist
files:
  - out/**
  - resources/**
  - package.json
asarUnpack:
  - resources/**
# Stable, space-free asset names so electron-updater's latest.yml matches what GitHub serves.
artifactName: ai-usage-setup-${version}.${ext}
publish:
  provider: github
  owner: Schoolees
  repo: ai-usage
win:
  target:
    - target: nsis
      arch: [x64]
  icon: build/icon.ico
nsis:
  # The same wizard as SchooleesPulse: an install-location page and a finish page with "Run".
  # Unlike SchooleesPulse it stays per-user. AI Usage reads the signed-in user's CLI logins, and a
  # per-machine install would ask for admin rights on every automatic update. build/installer.nsh
  # skips the "who is this for" page that a per-user assisted installer would otherwise show.
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: AI Usage
  runAfterFinish: true
