appId: com.schoolees.ai-usage
productName: AI Usage
directories:
  buildResources: build
  output: dist
files:
  - out/**
  - resources/**
  - package.json
asarUnpack:
  - resources/**
# Stable, space-free asset names so electron-updater's latest.yml matches what GitHub serves.
artifactName: ai-usage-setup-${version}.${ext}
publish:
  provider: github
  owner: Schoolees
  repo: ai-usage
win:
  target:
    - target: nsis
      arch: [x64]
  icon: build/icon.ico
nsis:
  oneClick: true
  perMachine: false
  createDesktopShortcut: false
  createStartMenuShortcut: true
  shortcutName: AI Usage
  runAfterFinish: true
